<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0D1117;
    --panel: #151B23;
    --panel-raised: #1B232D;
    --border: #232B36;
    --text-primary: #E6EDF3;
    --text-muted: #6B7785;
    --accent: #E3B341;
    --accent-dim: #4A3F22;
    --teal: #3FB8AF;
    --teal-dim: #1E3937;
    --danger: #E5534B;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(227,179,65,0.05), transparent 40%),
      radial-gradient(circle at 85% 100%, rgba(63,184,175,0.05), transparent 40%),
      var(--bg);
    color: var(--text-primary);
    font-family: var(--font-body);
    padding: clamp(16px, 4vw, 48px);
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
  }

  /* ---- Header / Instrument Strip ---- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 16px;
    padding-bottom: 20px;
    margin-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .brand .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px 1px rgba(227,179,65,0.7);
    flex-shrink: 0;
  }

  .brand h1 {
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
  }

  .brand span.sub {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .clockblock {
    text-align: right;
  }

  #time {
    font-family: var(--font-mono);
    font-size: clamp(1.6rem, 5vw, 2.1rem);
    font-weight: 700;
    letter-spacing: 0.03em;
    line-height: 1;
  }

  #date {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  /* ---- Panels ---- */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 20px;
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .panel-head h2 {
    font-family: var(--font-display);
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0;
    letter-spacing: 0.02em;
  }

  .panel-head .count {
    font-family: var(--font-mono);
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* ---- To-do list ---- */
  .todo-input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .todo-input-row input {
    flex: 1;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.9rem;
    outline: none;
    transition: border-color 0.15s ease;
  }

  .todo-input-row input:focus {
    border-color: var(--accent);
  }

  .todo-input-row input::placeholder {
    color: var(--text-muted);
  }

  .todo-input-row button {
    background: var(--accent);
    color: #1a1406;
    border: none;
    border-radius: 8px;
    padding: 0 18px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .todo-input-row button:hover { filter: brightness(1.1); }

  ul.todo-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  ul.todo-list li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 12px;
    border-radius: 8px;
    background: var(--panel-raised);
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }

  ul.todo-list li:hover {
    border-color: var(--border);
  }

  .checkbox {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    border: 1.5px solid var(--text-muted);
    flex-shrink: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s ease;
  }

  .checkbox.checked {
    background: var(--teal);
    border-color: var(--teal);
  }

  .checkbox.checked::after {
    content: '✓';
    color: #06211f;
    font-size: 12px;
    font-weight: 700;
  }

  .todo-text {
    flex: 1;
    font-size: 0.92rem;
    word-break: break-word;
  }

  .todo-text.done {
    color: var(--text-muted);
    text-decoration: line-through;
  }

  .remove-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    line-height: 1;
    padding: 4px;
    opacity: 0.5;
    transition: opacity 0.15s ease, color 0.15s ease;
  }

  .remove-btn:hover {
    opacity: 1;
    color: var(--danger);
  }

  .empty-state {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-family: var(--font-mono);
    text-align: center;
    padding: 20px 0;
  }

  /* ---- Habit tracker ---- */
  .habit-add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .habit-add-row input {
    flex: 1;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 0.88rem;
    outline: none;
  }

  .habit-add-row input:focus { border-color: var(--accent); }

  .habit-add-row button {
    background: var(--panel-raised);
    border: 1px solid var(--border);
    color: var(--text-primary);
    border-radius: 8px;
    padding: 0 16px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
  }

  .habit-add-row button:hover { border-color: var(--accent); }

  .habit-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 0;
    border-top: 1px solid var(--border);
  }

  .habit-row:first-of-type { border-top: none; }

  .habit-name {
    width: 130px;
    flex-shrink: 0;
    font-size: 0.88rem;
    font-weight: 500;
    word-break: break-word;
  }

  .habit-signal {
    display: flex;
    gap: 5px;
    flex: 1;
    flex-wrap: nowrap;
  }

  .cell {
    flex: 1;
    height: 26px;
    border-radius: 4px;
    background: var(--panel-raised);
    border: 1px solid var(--border);
    cursor: pointer;
    position: relative;
    transition: all 0.15s ease;
    min-width: 12px;
  }

  .cell:hover { border-color: var(--accent); }

  .cell.active {
    background: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 8px rgba(227,179,65,0.5);
  }

  .cell.today {
    outline: 1px dashed var(--text-muted);
    outline-offset: 2px;
  }

  .habit-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 1rem;
    opacity: 0.5;
    flex-shrink: 0;
  }

  .habit-remove:hover { opacity: 1; color: var(--danger); }

  .day-labels {
    display: flex;
    gap: 5px;
    padding-left: 144px;
    margin-bottom: 8px;
  }

  .day-labels span {
    flex: 1;
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  footer {
    text-align: center;
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--text-muted);
    margin-top: 30px;
    letter-spacing: 0.05em;
  }

  @media (max-width: 520px) {
    .habit-name { width: 80px; font-size: 0.78rem; }
    .day-labels { padding-left: 94px; }
    .clockblock { text-align: left; }
    header { align-items: flex-start; }
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Control Panel</h1>
        <span class="sub">Personal Dashboard</span>
      </div>
    </div>
    <div class="clockblock">
      <div id="time">--:--:--</div>
      <div id="date">LOADING</div>
    </div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <h2>Tasks</h2>
      <span class="count" id="task-count">0 open</span>
    </div>
    <div class="todo-input-row">
      <input type="text" id="todo-input" placeholder="Add a task and hit enter..." maxlength="120">
      <button id="todo-add">Add</button>
    </div>
    <ul class="todo-list" id="todo-list"></ul>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>Habit Signal</h2>
      <span class="count" id="habit-count">7-day view</span>
    </div>
    <div class="habit-add-row">
      <input type="text" id="habit-input" placeholder="Add a habit to track..." maxlength="40">
      <button id="habit-add">Add</button>
    </div>
    <div class="day-labels" id="day-labels"></div>
    <div id="habit-list"></div>
  </section>

  <footer>SYSTEM NOMINAL &middot; DATA STORED LOCALLY IN THIS BROWSER</footer>
</div>

<script>
  // ---------- Clock ----------
  function updateClock() {
    const now = new Date();
    const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    document.getElementById('time').textContent = timeStr;
    document.getElementById('date').textContent = dateStr.toUpperCase();
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- Storage helpers ----------
  const STORE_KEY = 'controlpanel:v1';

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return { todos: [], habits: [] };
      const parsed = JSON.parse(raw);
      return {
        todos: Array.isArray(parsed.todos) ? parsed.todos : [],
        habits: Array.isArray(parsed.habits) ? parsed.habits : []
      };
    } catch (e) {
      console.error('Failed to load state', e);
      return { todos: [], habits: [] };
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
    } catch (e) {
      console.error('Failed to save state', e);
    }
  }

  let state = loadState();

  // ---------- Todos ----------
  const todoList = document.getElementById('todo-list');
  const todoInput = document.getElementById('todo-input');
  const taskCount = document.getElementById('task-count');

  function renderTodos() {
    todoList.innerHTML = '';
    if (state.todos.length === 0) {
      todoList.innerHTML = '<div class="empty-state">No tasks yet. Add your first one above.</div>';
    } else {
      state.todos.forEach(todo => {
        const li = document.createElement('li');

        const cb = document.createElement('div');
        cb.className = 'checkbox' + (todo.done ? ' checked' : '');
        cb.addEventListener('click', () => {
          todo.done = !todo.done;
          saveState();
          renderTodos();
        });

        const text = document.createElement('span');
        text.className = 'todo-text' + (todo.done ? ' done' : '');
        text.textContent = todo.text;

        const remove = document.createElement('button');
        remove.className = 'remove-btn';
        remove.setAttribute('aria-label', 'Delete task');
        remove.textContent = '✕';
        remove.addEventListener('click', () => {
          state.todos = state.todos.filter(t => t.id !== todo.id);
          saveState();
          renderTodos();
        });

        li.appendChild(cb);
        li.appendChild(text);
        li.appendChild(remove);
        todoList.appendChild(li);
      });
    }
    const open = state.todos.filter(t => !t.done).length;
    taskCount.textContent = `${open} open`;
  }

  function addTodo() {
    const val = todoInput.value.trim();
    if (!val) return;
    state.todos.unshift({ id: Date.now() + Math.random(), text: val, done: false });
    todoInput.value = '';
    saveState();
    renderTodos();
  }

  document.getElementById('todo-add').addEventListener('click', addTodo);
  todoInput.addEventListener('keydown', e => { if (e.key === 'Enter') addTodo(); });

  // ---------- Habits ----------
  const habitList = document.getElementById('habit-list');
  const habitInput = document.getElementById('habit-input');
  const dayLabelsEl = document.getElementById('day-labels');

  function last7Dates() {
    const days = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      days.push(d.toISOString().slice(0, 10)); // YYYY-MM-DD
    }
    return days;
  }

  function renderDayLabels() {
    const days = last7Dates();
    dayLabelsEl.innerHTML = '';
    days.forEach(dateStr => {
      const d = new Date(dateStr + 'T00:00:00');
      const label = d.toLocaleDateString('en-US', { weekday: 'narrow' });
      const span = document.createElement('span');
      span.textContent = label;
      dayLabelsEl.appendChild(span);
    });
  }

  function renderHabits() {
    habitList.innerHTML = '';
    const days = last7Dates();
    const today = days[days.length - 1];

    if (state.habits.length === 0) {
      habitList.innerHTML = '<div class="empty-state">No habits yet. Add one to start tracking.</div>';
      return;
    }

    state.habits.forEach(habit => {
      if (!habit.log) habit.log = {};
      const row = document.createElement('div');
      row.className = 'habit-row';

      const name = document.createElement('div');
      name.className = 'habit-name';
      name.textContent = habit.name;

      const signal = document.createElement('div');
      signal.className = 'habit-signal';

      days.forEach(dateStr => {
        const cell = document.createElement('div');
        cell.className = 'cell' + (habit.log[dateStr] ? ' active' : '') + (dateStr === today ? ' today' : '');
        cell.title = dateStr;
        cell.addEventListener('click', () => {
          habit.log[dateStr] = !habit.log[dateStr];
          saveState();
          renderHabits();
        });
        signal.appendChild(cell);
      });

      const remove = document.createElement('button');
      remove.className = 'habit-remove';
      remove.setAttribute('aria-label', 'Delete habit');
      remove.textContent = '✕';
      remove.addEventListener('click', () => {
        state.habits = state.habits.filter(h => h.id !== habit.id);
        saveState();
        renderHabits();
      });

      row.appendChild(name);
      row.appendChild(signal);
      row.appendChild(remove);
      habitList.appendChild(row);
    });
  }

  function addHabit() {
    const val = habitInput.value.trim();
    if (!val) return;
    state.habits.push({ id: Date.now() + Math.random(), name: val, log: {} });
    habitInput.value = '';
    saveState();
    renderHabits();
  }

  document.getElementById('habit-add').addEventListener('click', addHabit);
  habitInput.addEventListener('keydown', e => { if (e.key === 'Enter') addHabit(); });

  // ---------- Init ----------
  renderDayLabels();
  renderTodos();
  renderHabits();
</script>
</body>
</html>
